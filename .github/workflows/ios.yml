name: build-ios-ipa

on:
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild -project oz.xcodeproj -scheme oz \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build 2>&1 | tail -40

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/oz.app Payload/
          zip -qry oz-unsigned.ipa Payload
          ls -lh oz-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: oz-unsigned-ipa
          path: oz-unsigned.ipa
          if-no-files-found: error
